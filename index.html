<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Valeria 💛</title>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 26%,
            rgba(255,255,255,.98) 0%,
            rgba(255,252,219,.96) 20%,
            rgba(255,241,163,.60) 45%,
            transparent 67%
        ),
        linear-gradient(
            160deg,
            #fffef8 0%,
            #fff8cf 44%,
            #f4d975 100%
        );

    position:relative;
}


/* =========================================================
   FONDO
========================================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.8) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(255,255,255,.65) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 35% 75%,
            rgba(255,245,167,.8) 0 2px,
            transparent 3px
        );

    background-size:
        170px 170px,
        220px 220px,
        150px 150px;

    opacity:.9;

    pointer-events:none;
}


/* =========================================================
   HALO
========================================================= */

.halo{
    position:absolute;

    width:650px;
    height:650px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.82) 0%,
            rgba(255,250,202,.38) 42%,
            transparent 68%
        );

    filter:blur(4px);

    animation:
        haloPulse
        5s
        ease-in-out
        infinite;
}

@keyframes haloPulse{

    0%,
    100%{
        transform:
            translate(-50%,-50%)
            scale(.96);

        opacity:.78;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.04);

        opacity:1;
    }

}


/* =========================================================
   ESCENA
========================================================= */

.scene{
    position:relative;

    width:min(100vw, 900px);
    height:min(100vh, 900px);

    min-height:700px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
}


/* =========================================================
   RAMO COMPLETO
========================================================= */

.bouquet{
    position:absolute;

    width:650px;
    height:820px;

    left:50%;
    bottom:-10px;

    transform:
        translateX(-50%);

    animation:
        bouquetEntrance
        1.8s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes bouquetEntrance{

    from{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(80px)
            scale(.9);
    }

    to{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   SOMBRA DEL RAMO
========================================================= */

.bouquet-shadow{
    position:absolute;

    width:430px;
    height:85px;

    left:50%;
    bottom:35px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        rgba(114,83,14,.20);

    filter:blur(28px);
}


/* =========================================================
   TALLOS
========================================================= */

.stem{
    position:absolute;

    width:4px;
    height:var(--h);

    left:50%;
    bottom:150px;

    border-radius:20px;

    transform-origin:
        bottom center;

    transform:
        translateX(-50%)
        rotate(var(--r));

    background:
        linear-gradient(
            to right,
            #375a31,
            #6f945a,
            #446f39
        );

    box-shadow:
        1px 0 2px
        rgba(44,73,36,.15);

    animation:
        stemMove
        var(--speed)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);
}


@keyframes stemMove{

    0%,
    100%{
        transform:
            translateX(-50%)
            rotate(var(--r));
    }

    50%{
        transform:
            translateX(-50%)
            rotate(calc(var(--r) + 1.5deg));
    }

}


/* =========================================================
   RAMITAS
========================================================= */

.branch{
    position:absolute;

    width:2px;
    height:var(--bh);

    bottom:var(--bottom);
    left:50%;

    transform-origin:
        bottom center;

    transform:
        rotate(var(--br));

    border-radius:20px;

    background:
        linear-gradient(
            #759b62,
            #496f3c
        );
}

.branch::before{
    content:"";

    position:absolute;

    width:2px;
    height:65%;

    left:0;
    bottom:45%;

    transform-origin:
        bottom center;

    transform:
        rotate(37deg);

    background:#6f965d;

    border-radius:20px;
}

.branch::after{
    content:"";

    position:absolute;

    width:2px;
    height:55%;

    left:0;
    bottom:64%;

    transform-origin:
        bottom center;

    transform:
        rotate(-35deg);

    background:#729960;

    border-radius:20px;
}


/* =========================================================
   HOJAS
========================================================= */

.leaf{
    position:absolute;

    width:16px;
    height:45px;

    left:50%;
    bottom:var(--ly);

    transform-origin:
        bottom center;

    transform:
        translateX(-50%)
        rotate(var(--lr));

    border-radius:
        100% 0
        100% 0;

    background:
        linear-gradient(
            135deg,
            #365f32,
            #7ca069
        );

    box-shadow:
        inset 2px 2px 3px
        rgba(255,255,255,.1);
}


/* =========================================================
   FLOR NUBECITA
========================================================= */

.flower{
    position:absolute;

    width:var(--size);
    height:var(--size);

    left:var(--x);
    bottom:var(--y);

    transform:
        translate(-50%,50%);

    animation:
        flowerFloat
        var(--fspeed)
        ease-in-out
        infinite;

    animation-delay:
        var(--fdelay);

    filter:
        drop-shadow(
            0 3px 3px
            rgba(154,120,15,.10)
        );
}


@keyframes flowerFloat{

    0%,
    100%{
        transform:
            translate(-50%,50%)
            rotate(-2deg)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,50%)
            rotate(3deg)
            scale(1.07);
    }

}


.petal{
    position:absolute;

    width:55%;
    height:55%;

    border-radius:
        60% 60% 55% 55%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fffde0 0%,
            #fff58d 25%,
            #ffe34d 62%,
            #e8bd22 100%
        );

    border:
        1px solid
        rgba(235,195,40,.15);

    box-shadow:
        inset 2px 2px 5px
        rgba(255,255,255,.65);
}


.petal:nth-child(1){
    top:0;
    left:23%;
}

.petal:nth-child(2){
    right:0;
    top:22%;
}

.petal:nth-child(3){
    right:12%;
    bottom:0;
}

.petal:nth-child(4){
    left:12%;
    bottom:0;
}

.petal:nth-child(5){
    left:0;
    top:22%;
}


.flower::after{
    content:"";

    position:absolute;

    width:23%;
    height:23%;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f8ce52,
            #be8420
        );

    box-shadow:
        0 0 0 2px
        rgba(255,240,112,.38);
}


/* =========================================================
   FLORES MUY PEQUEÑAS
========================================================= */

.mini{
    position:absolute;

    width:var(--mini);
    height:var(--mini);

    left:var(--mx);
    bottom:var(--my);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffac0,
            #ffe65d 60%,
            #dcae20
        );

    box-shadow:
        0 0 0 3px
        rgba(255,235,73,.24);

    animation:
        miniMove
        var(--mspeed)
        ease-in-out
        infinite;

    animation-delay:
        var(--mdelay);
}

@keyframes miniMove{

    0%,
    100%{
        transform:
            translateY(0)
            scale(.9);
    }

    50%{
        transform:
            translateY(-5px)
            scale(1.1);
    }

}


/* =========================================================
   PAPEL DEL RAMO
========================================================= */

.wrapper-back{
    position:absolute;

    width:420px;
    height:360px;

    left:50%;
    bottom:50px;

    transform:
        translateX(-50%);

    clip-path:
        polygon(
            4% 0,
            96% 0,
            69% 100%,
            31% 100%
        );

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.84),
            rgba(254,242,184,.67)
        );

    border:
        1px solid
        rgba(255,255,255,.65);

    backdrop-filter:
        blur(4px);

    box-shadow:
        0 25px 45px
        rgba(126,93,16,.18);

    z-index:20;
}


.wrapper-left{
    position:absolute;

    width:275px;
    height:315px;

    left:80px;
    bottom:67px;

    z-index:21;

    clip-path:
        polygon(
            0 4%,
            100% 25%,
            80% 100%,
            26% 94%
        );

    background:
        linear-gradient(
            140deg,
            rgba(255,255,255,.82),
            rgba(238,211,128,.72)
        );

    transform:
        rotate(5deg);

    box-shadow:
        0 15px 25px
        rgba(117,83,12,.08);
}


.wrapper-right{
    position:absolute;

    width:280px;
    height:320px;

    right:75px;
    bottom:68px;

    z-index:21;

    clip-path:
        polygon(
            0 24%,
            100% 3%,
            74% 94%,
            20% 100%
        );

    background:
        linear-gradient(
            220deg,
            rgba(255,255,255,.88),
            rgba(239,211,126,.72)
        );

    transform:
        rotate(-5deg);
}


/* =========================================================
   DETALLE PAPEL
========================================================= */

.paper-line{
    position:absolute;

    width:310px;
    height:1px;

    left:50%;
    bottom:250px;

    transform:
        translateX(-50%)
        rotate(-1deg);

    background:
        rgba(179,138,44,.25);

    z-index:22;
}


/* =========================================================
   LISTÓN
========================================================= */

.ribbon-center{
    position:absolute;

    width:110px;
    height:43px;

    left:50%;
    bottom:150px;

    transform:
        translateX(-50%);

    z-index:40;

    border-radius:
        50% 50% 48% 48%;

    background:
        linear-gradient(
            180deg,
            #eccd75,
            #c79b38 65%,
            #a87222
        );

    box-shadow:
        inset 0 3px 6px
        rgba(255,255,255,.3),
        0 9px 15px
        rgba(80,51,5,.20);
}


.ribbon-left,
.ribbon-right{
    position:absolute;

    width:120px;
    height:100px;

    bottom:83px;

    z-index:35;

    background:
        linear-gradient(
            160deg,
            #dbb453,
            #9b671d
        );
}


.ribbon-left{
    left:215px;

    clip-path:
        polygon(
            100% 0,
            78% 100%,
            44% 72%,
            0 100%,
            26% 4%
        );

    transform:
        rotate(7deg);
}


.ribbon-right{
    right:215px;

    clip-path:
        polygon(
            0 0,
            74% 4%,
            100% 100%,
            56% 72%,
            22% 100%
        );

    transform:
        rotate(-7deg);
}


/* =========================================================
   TARJETA
========================================================= */

.card{
    position:absolute;

    width:255px;

    left:50%;
    bottom:16px;

    transform:
        translateX(-50%)
        rotate(-1.5deg);

    padding:
        18px
        20px
        17px;

    z-index:60;

    text-align:center;

    color:#76581d;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(255,250,224,.97)
        );

    border:
        1px solid
        rgba(191,154,62,.28);

    border-radius:5px;

    box-shadow:
        0 16px 28px
        rgba(95,67,13,.16);
}


.card::before{
    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(198,159,58,.14);

    pointer-events:none;
}


.card .tiny{
    font-family:
        Georgia,
        serif;

    font-size:11px;

    letter-spacing:3px;

    text-transform:uppercase;

    color:#be942d;

    margin-bottom:7px;
}


.card h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:25px;

    font-weight:500;

    line-height:1.1;

    margin-bottom:8px;

    color:#8b681c;
}


.card .heart{
    display:inline-block;

    margin-bottom:8px;

    color:#ddae28;

    font-size:15px;

    animation:
        heartbeat
        2s
        ease-in-out
        infinite;
}


@keyframes heartbeat{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }

}


.card p{
    font-size:11px;

    line-height:1.55;

    color:#8b7644;
}


/* =========================================================
   PARTÍCULAS
========================================================= */

.spark{
    position:absolute;

    width:6px;
    height:6px;

    left:var(--sx);
    top:var(--sy);

    border-radius:50%;

    background:#fff9ad;

    box-shadow:
        0 0 8px #ffe459,
        0 0 16px rgba(255,221,71,.65);

    animation:
        sparkle
        var(--sspeed)
        ease-in-out
        infinite;

    animation-delay:
        var(--sdelay);
}


@keyframes sparkle{

    0%,
    100%{
        opacity:0;
        transform:scale(.2);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

}


/* =========================================================
   PÉTALOS FLOTANTES
========================================================= */

.falling-petal{
    position:absolute;

    width:12px;
    height:17px;

    left:var(--px);
    top:-40px;

    border-radius:
        90% 20%
        90% 20%;

    background:
        linear-gradient(
            135deg,
            #fff6a3,
            #eecb3b
        );

    opacity:.75;

    animation:
        petalFall
        var(--ptime)
        linear
        infinite;

    animation-delay:
        var(--pdelay);
}


@keyframes petalFall{

    0%{
        transform:
            translateY(-50px)
            translateX(0)
            rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:.75;
    }

    50%{
        transform:
            translateY(440px)
            translateX(40px)
            rotate(180deg);
    }

    100%{
        transform:
            translateY(920px)
            translateX(-30px)
            rotate(360deg);

        opacity:0;
    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    body{
        overflow:hidden;
    }

    .scene{
        width:100vw;
        height:100vh;
        min-height:680px;
    }

    .bouquet{
        transform:
            translateX(-50%)
            scale(.75);

        transform-origin:
            center bottom;
    }

    @keyframes bouquetEntrance{

        from{
            opacity:0;

            transform:
                translateX(-50%)
                translateY(60px)
                scale(.67);
        }

        to{
            opacity:1;

            transform:
                translateX(-50%)
                translateY(0)
                scale(.75);
        }

    }

}


@media(max-width:430px){

    .bouquet{
        transform:
            translateX(-50%)
            scale(.66);
    }

    @keyframes bouquetEntrance{

        from{
            opacity:0;

            transform:
                translateX(-50%)
                translateY(60px)
                scale(.58);
        }

        to{
            opacity:1;

            transform:
                translateX(-50%)
                translateY(0)
                scale(.66);
        }

    }

}


/* =========================================================
   CARTA DE ENTRADA
========================================================= */

.letter-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:22px;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.98), transparent 32%),
        radial-gradient(circle at 14% 18%, rgba(255,235,112,.33), transparent 25%),
        radial-gradient(circle at 86% 78%, rgba(255,219,74,.25), transparent 30%),
        linear-gradient(145deg,#fffef8 0%,#fff8d5 48%,#f2d469 100%);
    transition:opacity 1.15s ease, transform 1.15s ease, filter 1.15s ease;
}

.letter-overlay::before,
.letter-overlay::after{
    content:"✦";
    position:absolute;
    color:rgba(212,166,39,.38);
    font-size:34px;
    animation:letterSpark 3.2s ease-in-out infinite;
}

.letter-overlay::before{ left:9%; top:18%; }
.letter-overlay::after{ right:10%; bottom:16%; animation-delay:1.2s; }

@keyframes letterSpark{
    0%,100%{ opacity:.18; transform:scale(.7) rotate(0deg); }
    50%{ opacity:.8; transform:scale(1.15) rotate(20deg); }
}

.letter-paper{
    position:relative;
    width:min(720px,94vw);
    max-height:90vh;
    overflow-y:auto;
    padding:56px 58px 48px;
    border-radius:7px;
    background:
        linear-gradient(rgba(255,255,255,.93),rgba(255,251,234,.97)),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(170,131,45,.08) 32px);
    border:1px solid rgba(185,145,50,.23);
    box-shadow:0 34px 95px rgba(92,63,7,.22), inset 0 0 0 1px rgba(255,255,255,.85);
    scrollbar-width:thin;
    scrollbar-color:#d8b75a transparent;
    animation:letterEnter 1.2s cubic-bezier(.16,.84,.22,1) both;
}

.letter-paper::-webkit-scrollbar{ width:7px; }
.letter-paper::-webkit-scrollbar-thumb{ background:#d8b75a; border-radius:10px; }

.letter-paper::before{
    content:"";
    position:absolute;
    inset:16px;
    border:1px solid rgba(191,151,56,.16);
    pointer-events:none;
}

@keyframes letterEnter{
    from{ opacity:0; transform:translateY(45px) scale(.95) rotate(-1deg); }
    to{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
}

.letter-kicker{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#b68a25;
    margin-bottom:10px;
}

.letter-title{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,7vw,62px);
    line-height:1;
    font-weight:400;
    color:#82601b;
    margin-bottom:8px;
}

.letter-heart{
    position:relative;
    z-index:2;
    text-align:center;
    color:#d9a825;
    font-size:18px;
    margin-bottom:30px;
    animation:letterHeart 1.9s ease-in-out infinite;
}

@keyframes letterHeart{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.28); }
}

.letter-text{
    position:relative;
    z-index:2;
    min-height:230px;
    white-space:pre-wrap;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    line-height:1.92;
    color:#62502e;
}

.letter-cursor{
    display:inline-block;
    color:#c9961f;
    font-weight:bold;
    animation:letterBlink .68s steps(1) infinite;
}

@keyframes letterBlink{ 50%{ opacity:0; } }

.letter-sign{
    position:relative;
    z-index:2;
    margin-top:28px;
    text-align:right;
    font-family:Georgia,"Times New Roman",serif;
    color:#8b6a28;
    opacity:0;
    transform:translateY(8px);
    transition:.7s ease;
}

.letter-sign.show{ opacity:1; transform:translateY(0); }

.letter-action{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    margin-top:24px;
    opacity:0;
    transform:translateY(14px) scale(.96);
    pointer-events:none;
    transition:.7s ease;
}

.letter-action.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.letter-button{
    border:none;
    cursor:pointer;
    padding:14px 30px;
    border-radius:999px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    font-weight:700;
    color:#6c4b00;
    background:linear-gradient(135deg,#fff18a,#ffc933);
    box-shadow:0 12px 28px rgba(164,112,0,.24), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
    animation:buttonGlow 2.1s ease-in-out infinite;
}

.letter-button:hover{
    transform:translateY(-2px) scale(1.06);
    box-shadow:0 16px 34px rgba(164,112,0,.32), inset 0 1px 0 rgba(255,255,255,.8);
    filter:brightness(1.03);
}

.letter-button:active{
    transform:scale(.98);
}

@keyframes buttonGlow{
    0%,100%{ box-shadow:0 12px 28px rgba(164,112,0,.22), 0 0 0 0 rgba(255,214,64,.24); }
    50%{ box-shadow:0 15px 32px rgba(164,112,0,.30), 0 0 0 9px rgba(255,214,64,0); }
}

.letter-overlay.hide-letter{
    opacity:0;
    transform:scale(1.035);
    filter:blur(10px);
    pointer-events:none;
}

/* Las flores esperan a que termine la carta */
.flower-stage{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transform:translateY(45px) scale(.92);
    filter:blur(8px);
}

.flower-stage.show-flowers{
    visibility:visible;
    animation:revealFlowers 1.9s cubic-bezier(.16,.84,.22,1) forwards;
}

/* El ramo no empieza a moverse hasta que termina la carta */
.flower-stage:not(.show-flowers) *,
.flower-stage:not(.show-flowers){
    animation-play-state:paused !important;
}

.flower-stage.show-flowers,
.flower-stage.show-flowers *{
    animation-play-state:running;
}

@keyframes revealFlowers{
    0%{ opacity:0; transform:translateY(45px) scale(.92); filter:blur(8px); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

@media(max-width:600px){

    .letter-paper{ width:100%; max-height:93vh; padding:40px 26px 36px; }
    .letter-text{ font-size:15.5px; line-height:1.82; min-height:200px; }

<script>
const carta = `Mi amor...

La verdad es que yo no sabía que el 21 de septiembre era el día de regalar flores amarillas, y cuando me enteré me dio mucha tristeza no haberlo sabido antes, porque de haberlo sabido habría buscado desde el primer momento la forma de tener un detalle contigo.

No quiero que pienses que por no haberlo sabido significa que no pensé en ti o que no me importa hacerte sentir especial, porque es todo lo contrario. A pesar de todo lo que hemos vivido, de los momentos bonitos y también de los que nos han costado más, hay algo que sigue siendo completamente sincero en mí, te amo demasiado.

Sé que no siempre hago las cosas de la mejor manera. A veces me equivoco, a veces llego tarde a ciertos detalles y hay cosas que quisiera haber hecho diferente contigo. Pero cuando se trata de ti, siempre intento encontrar una forma, porque no hay cosa que no haría por ti.

Eres demasiado importante para mí y me nace demostrarte lo mucho que significas para mí, incluso cuando las circunstancias no son exactamente como quisiera.

Tal vez hoy no pueda llegar hasta ti con un ramo, pero eso no significa que no pueda buscar otra manera de darte flores. Cuando me enteré de esto te lo juro me senti mal pero aun asi pense en ti, y quise hacer algo bonito, algo que naciera desde lo que siento, con cariño, con amor y pensando solamente en ti.

Perdóname por las veces en las que me he equivocado contigo, por aquello que pude haber hecho mejor y por esos momentos en los que quizá no supe demostrarte correctamente todo lo que significas para mí.

Te amo demasiado, Valeria.

Y estas sí son para ti. 💛`;

const letterText = document.getElementById('letterText');
const letterCursor = document.getElementById('letterCursor');
const letterOverlay = document.getElementById('letterOverlay');
const letterPaper = document.getElementById('letterPaper');
const letterSign = document.getElementById('letterSign');
const letterAction = document.getElementById('letterAction');
const letterButton = document.getElementById('letterButton');
const flowerStage = document.getElementById('flowerStage');

let indice = 0;
const velocidad = 14;

function escribirCarta(){
    if(indice < carta.length){
        letterText.textContent += carta.charAt(indice);
        indice++;

        // La carta baja sola para que siempre se vea lo último que se escribe.
        letterPaper.scrollTop = letterPaper.scrollHeight;

        let pausa = velocidad;
        const ultimo = carta.charAt(indice - 1);
        if(ultimo === '.' || ultimo === ',' || ultimo === '\n') pausa = 42;

        setTimeout(escribirCarta, pausa);
    }else{
        letterCursor.style.display = 'none';
        letterSign.classList.add('show');
        letterAction.classList.add('show');
        letterPaper.scrollTop = letterPaper.scrollHeight;
    }
}

function mostrarFlores(){
    letterButton.disabled = true;
    letterOverlay.classList.add('hide-letter');

    setTimeout(() => {
        letterOverlay.style.display = 'none';
        flowerStage.classList.add('show-flowers');
    }, 1150);
}

letterButton.addEventListener('click', mostrarFlores);

setTimeout(escribirCarta, 900);
</script>
